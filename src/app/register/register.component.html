      <div class="mb-3">
        <label style="margin-right: 10px;"> I am a:</label>
        <label class="form-check-label"><input type="radio" class="form-check-input" value="male" formControlName="gender"/>Male </label>
        <label class="form-check-label"> <input type="radio" class="form-check-input" value="female" formControlName="gender"/>Female</label>
      </div>
    <app-text-input 
    [formControl]="$any(registerFrom.controls['username'])"
    [label] ="'Username'"
    [type]="'text'" > 
    </app-text-input>

    <app-text-input 
    [formControl]="$any(registerFrom.controls['knownAs'])"
    [label] ="'Known As'"
    [type]="'text'" > 
    </app-text-input>

    <app-date-picker
    [formControl]="$any(registerFrom.controls['dateOfBirth'])"
    [label] ="'Date Of Birth'" > 
    </app-date-picker> 

    <app-text-input 
    [formControl]="$any(registerFrom.controls['city'])"
    [label] ="'City'"
    [type]="'text'" > 
    </app-text-input>

    <app-text-input 
    [formControl]="$any(registerFrom.controls['country'])"
    [label] ="'Country'"
    [type]="'text'" > 
    </app-text-input>

    <app-text-input 
    [formControl]="$any(registerFrom.controls['password'])"
    [label] ="'password'"
    [type]="'text'" > 
    </app-text-input>

    <app-text-input 
    [formControl]="$any(registerFrom.controls['confrimPassword'])"
    [label] ="'Confrim Password'"
    [type]="'password'" > 
    </app-text-input>

      @if(validationErrors){
        <div class="alert alert-danger text-start">
          <ul>
          @for (error of validationErrors; track $index) {
            <li>{{error}}</li>
          }
        </ul>
      </div>
      }

    <div class="form-group text-center">
    <button class="btn btn-success me-2" [disabled]="!registerFrom.valid" type="submit">Register</button>
    <button class="btn btn-default me-2" type="button" (click)="cancel()">Cancel</button>
    </div>
</form>
